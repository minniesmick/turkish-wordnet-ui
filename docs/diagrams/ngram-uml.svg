<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 980 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ngram-uml-t ngram-uml-d" class="uml-svg">
      <title id="ngram-uml-t">N-gram dil modeli · UML sınıf diyagramı</title>
      <desc id="ngram-uml-d">LanguageModel, her düzey için bir NgramTable'a sahiptir; tablo geçmiş başına bir Entry tutar (toplam ve sonraki sözcük sayımları). LanguageModel yumuşatma ayarını (Config) kullanır ve bir olasılık sonucu (Prob) döndürür.</desc>
